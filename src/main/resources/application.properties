spring.application.name=ticket-tracking-system

# Load local secrets from .env (optional: absent in CI/prod, where real env vars are used)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (JdbcTemplate uses this DataSource)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Resend email API. Bridge the .env names (RESEND_*) to the property names the code reads.
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Run schema.sql on startup to create tables in the configured PostgreSQL database.
# Safe to re-run: schema.sql uses CREATE TABLE/INDEX IF NOT EXISTS.
spring.sql.init.mode=always

